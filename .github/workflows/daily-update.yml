name: daily-update
on:
  schedule:
    - cron: "0 16 * * *"      # UTC 16:00 = 北京 0:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update README
        run: python3 scripts/update_readme.py
      - name: Commit
        run: |
          git config user.name "daily-update"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; exit 0; fi
          git add README.md
          git commit -m "每日更新共享账号 $(TZ=Asia/Shanghai date +%F)"
          git push
